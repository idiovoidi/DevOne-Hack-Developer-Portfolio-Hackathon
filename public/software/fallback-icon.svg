<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="128" cy="128" r="120" fill="url(#grad)" opacity="0.9"/>
  
  <!-- Software icon symbol (generic app window) -->
  <rect x="64" y="80" width="128" height="96" rx="8" fill="white" opacity="0.2"/>
  <rect x="64" y="80" width="128" height="24" rx="8" fill="white" opacity="0.3"/>
  
  <!-- Three dots (window controls) -->
  <circle cx="80" cy="92" r="4" fill="white" opacity="0.8"/>
  <circle cx="96" cy="92" r="4" fill="white" opacity="0.8"/>
  <circle cx="112" cy="92" r="4" fill="white" opacity="0.8"/>
  
  <!-- Code brackets symbol -->
  <path d="M 100 130 L 85 145 L 100 160" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <path d="M 156 130 L 171 145 L 156 160" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <line x1="135" y1="125" x2="121" y2="165" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
